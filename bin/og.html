<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#fff;font-family:Inter,system-ui,-apple-system,sans-serif;color:#09090b;-webkit-font-smoothing:antialiased;
 background-image:linear-gradient(#f4f4f5 1px,transparent 1px),linear-gradient(90deg,#f4f4f5 1px,transparent 1px);background-size:48px 48px}
.card{position:absolute;inset:56px;background:#fff;border:1px solid #e4e4e7;border-radius:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:64px 72px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:16px;font-weight:600;font-size:30px}
.badge{display:inline-flex;align-items:center;gap:10px;border:1px solid #e4e4e7;border-radius:999px;padding:6px 18px;font-size:22px;color:#71717a;margin-top:auto;align-self:flex-start}
.badge:before{content:"";width:10px;height:10px;border-radius:50%;background:#22c55e}
h1{font-size:88px;letter-spacing:-.03em;line-height:1;margin:22px 0 18px}
p{font-size:32px;color:#71717a;margin:0}
.url{position:absolute;right:72px;top:72px;font-size:24px;color:#71717a}
</style></head><body><div class="card">
<div class="logo"><img src="../favicon.svg" width="48" height="48">AltynCore</div>
<div class="url">altyncore.kz</div>
<span class="badge">Астана · с 2025 года</span>
<h1>ТОО «AltynCore»</h1>
<p>Разработка программного обеспечения</p>
</div></body></html>
